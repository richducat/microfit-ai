    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '6.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.microfit.deletion-regression
schemes:
  DeletionRegression:
    build:
      targets:
        DeletionRegression: all
    test:
      targets:
        - DeletionRegression
